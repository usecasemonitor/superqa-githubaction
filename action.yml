name: 'SuperQA'
description: 'Execute SuperQA test plans in your CI/CD pipeline'
author: 'SuperQA Team'

inputs:
  api_key:
    description: 'SuperQA API key (must start with az-)'
    required: true

  project_name:
    description: 'SuperQA project name'
    required: true

  test_plan_name:
    description: 'Test plan name'
    required: false

  test_run_name:
    description: 'Deprecated alias for test_plan_name'
    required: false

  environment_name:
    description: 'SuperQA project environment (e.g. production, staging). Defaults to default on the server.'
    required: false
    default: ''

  parallel_run:
    description: 'Run test cases in parallel (true/false)'
    required: false
    default: 'false'

  notification_json:
    description: 'Optional notification JSON (same shape as execute-now API / UI step 2)'
    required: false
    default: ''

  notification_emails:
    description: 'Comma-separated emails for failure alerts'
    required: false
    default: ''

  notify_on_success:
    description: 'Also notify when execution succeeds (true/false)'
    required: false
    default: 'false'

  skip_notifications:
    description: 'Skip all execution notifications (true/false)'
    required: false
    default: 'false'

  base_url:
    description: 'SuperQA base URL'
    required: false
    default: 'https://app.superqa.ai'

outputs:
  test_result:
    description: 'Test execution result (initiated or failure)'

runs:
  using: 'docker'
  image: 'Dockerfile'
  env:
    SUPERQA_ENVIRONMENT_NAME: ${{ inputs.environment_name }}
    SUPERQA_PARALLEL_RUN: ${{ inputs.parallel_run }}
    SUPERQA_NOTIFICATION_JSON: ${{ inputs.notification_json }}
    SUPERQA_NOTIFICATION_EMAILS: ${{ inputs.notification_emails }}
    SUPERQA_NOTIFY_ON_SUCCESS: ${{ inputs.notify_on_success }}
    SUPERQA_SKIP_NOTIFICATIONS: ${{ inputs.skip_notifications }}
  args:
    - '-m'
    - 'superqa.cli'
    - '--api-key'
    - ${{ inputs.api_key }}
    - '--base-url'
    - ${{ inputs.base_url }}
    - '--project-name'
    - ${{ inputs.project_name }}
    - '--test-plan-name'
    - ${{ inputs.test_plan_name || inputs.test_run_name }}
