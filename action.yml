name: 'SuperQA'
description: 'Execute SuperQA test plans in your CI/CD pipeline'
author: 'SuperQA Team'

inputs:
  api_key:
    description: 'SuperQA API key (must start with az-)'
    required: true

  project_name:
    description: 'SuperQA project name'
    required: false

  mode:
    description: 'Execution mode: run-plan or protect'
    required: false
    default: 'run-plan'

  test_plan_name:
    description: 'Test plan name'
    required: false

  test_run_name:
    description: 'Deprecated alias for test_plan_name'
    required: false

  environment_name:
    description: 'SuperQA project environment (e.g. production, staging). Defaults to default on the server.'
    required: false
    default: ''

  parallel_run:
    description: 'Run test cases in parallel (true/false)'
    required: false
    default: 'false'

  wait_for_result:
    description: 'Wait for a reconciled final result (requires backend /api/execute-now/result). Legacy default only initiates execution.'
    required: false
    default: 'false'

  timeout_seconds:
    description: 'Overall timeout when waiting for the final result'
    required: false
    default: '1800'

  poll_interval_seconds:
    description: 'Polling interval when waiting for the final result'
    required: false
    default: '5'

  notification_json:
    description: 'Optional notification JSON (same shape as execute-now API / UI step 2)'
    required: false
    default: ''

  notification_emails:
    description: 'Comma-separated emails for failure alerts'
    required: false
    default: ''

  notify_on_success:
    description: 'Also notify when execution succeeds (true/false)'
    required: false
    default: 'false'

  skip_notifications:
    description: 'Skip all execution notifications (true/false)'
    required: false
    default: 'false'

  base_url:
    description: 'SuperQA base URL'
    required: false
    default: 'https://app.superqa.ai'

outputs:
  test_result:
    description: 'initiated in legacy mode; passed, failed, blocked, infrastructure_failed, timed_out, or failure in wait mode'
  schedule_id:
    description: 'Created execution schedule ID (wait mode)'
  run_history_id:
    description: 'Exact execution history ID (wait mode)'
  report_url:
    description: 'Detailed SuperQA execution report URL (wait mode)'
  passed_count:
    description: 'Passed test cases (wait mode)'
  failed_count:
    description: 'Failed test cases (wait mode)'
  protect_run_id:
    description: 'Protect run ID (protect mode)'
  test_run_id:
    description: 'Execution history ID (protect mode)'
  passed_tests:
    description: 'Passed tests (protect mode)'
  failed_tests:
    description: 'Failed tests (protect mode)'

runs:
  using: 'docker'
  image: 'Dockerfile'
  env:
    SUPERQA_API_KEY: ${{ inputs.api_key }}
    SUPERQA_MODE: ${{ inputs.mode }}
    SUPERQA_WAIT_FOR_RESULT: ${{ inputs.wait_for_result }}
    SUPERQA_RESULT_TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
    SUPERQA_POLL_INTERVAL_SECONDS: ${{ inputs.poll_interval_seconds }}
    SUPERQA_ENVIRONMENT_NAME: ${{ inputs.environment_name }}
    SUPERQA_PARALLEL_RUN: ${{ inputs.parallel_run }}
    SUPERQA_NOTIFICATION_JSON: ${{ inputs.notification_json }}
    SUPERQA_NOTIFICATION_EMAILS: ${{ inputs.notification_emails }}
    SUPERQA_NOTIFY_ON_SUCCESS: ${{ inputs.notify_on_success }}
    SUPERQA_SKIP_NOTIFICATIONS: ${{ inputs.skip_notifications }}
    SUPERQA_BASE_URL: ${{ inputs.base_url }}
  args:
    - '-m'
    - 'superqa.cli'
    - '--base-url'
    - ${{ inputs.base_url }}
    - '--project-name'
    - ${{ inputs.project_name }}
    - '--test-plan-name'
    - ${{ inputs.test_plan_name || inputs.test_run_name }}
